<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Voxa CLI - Voice-Enabled Smart Chatbot Web Interface"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preload Fira Code font for terminal aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Voxa CLI - Voice-Enabled Smart Assistant</title>
    
    <style>
      /* Terminal loading screen */
      body {
        margin: 0;
        padding: 0;
        background: #000000;
        color: #00FF00;
        font-family: 'Fira Code', 'Courier New', monospace;
        overflow: hidden;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .loading-container {
        text-align: center;
        animation: glow 2s ease-in-out infinite alternate;
      }
      
      .loading-text {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 4px;
        margin-bottom: 20px;
        text-shadow: 
          0 0 10px #00FF00,
          0 0 20px #00FF00,
          0 0 30px #00FF00;
      }
      
      .loading-subtitle {
        font-size: 12px;
        color: #00FFFF;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.8;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 2px solid #404040;
        border-top: 2px solid #00FF00;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes glow {
        0% { filter: brightness(1); }
        100% { filter: brightness(1.2); }
      }
      
      /* Hide loading screen when React loads */
      .react-loaded {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Terminal loading screen -->
    <div class="loading-container" id="loading-screen">
      <div class="loading-text">VOXA CLI</div>
      <div class="loading-subtitle">Initializing Terminal...</div>
      <div class="loading-spinner"></div>
    </div>
    
    <!-- React root -->
    <div id="root"></div>
    
    <script>
      // Hide loading screen when React loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('react-loaded');
          }
        }, 1000);
      });
    </script>
  </body>
</html>
